<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>BB Installer</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
    --accent: #1f6feb; --ok: #2e7d32; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181a; --panel: #222225; --text: #ececea; --muted: #9a9a96; --line: #36363a;
            --accent: #4c8dff; --ok: #66bb6a; --err: #ef5350; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 14px/1.4 -apple-system, system-ui, sans-serif;
         background: var(--bg); color: var(--text); display: flex; flex-direction: column; gap: 14px; height: 100vh; }
  #device { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px;
            background: var(--panel); border: 1px solid var(--line); }
  #device .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  #device.on .dot { background: var(--ok); }
  #device small { color: var(--muted); display: block; }
  #drop { flex: 1; min-height: 120px; border: 2px dashed var(--line); border-radius: 10px; padding: 10px;
          display: flex; flex-direction: column; gap: 6px; overflow: auto; cursor: pointer; background: var(--panel); }
  #drop.over { border-color: var(--accent); }
  #drop:empty::before { content: 'Drop .bar files here, or click to choose'; margin: auto; color: var(--muted); }
  #drop:not(:empty)::after { content: '+  Drop more .bar files, or click to add'; flex: 1; min-height: 48px;
                             display: flex; align-items: center; justify-content: center; color: var(--muted); }
  #drop:hover:not(:has(.bar:hover)) { border-color: var(--accent); }
  #drop:hover:not(:has(.bar:hover))::before, #drop:hover:not(:has(.bar:hover))::after { color: var(--accent); }
  #drop.busy::after { visibility: hidden; }
  .bar { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px; align-items: center;
         padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); cursor: default; }
  .bar small { color: var(--muted); grid-column: 1 / -1; }
  .bar.bad small { color: var(--err); }
  .bar.done small { color: var(--ok); }
  .bar progress { grid-column: 1 / -1; width: 100%; height: 6px; accent-color: var(--accent); }
  .bar button { border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0 4px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .ver { color: var(--muted); font-variant-numeric: tabular-nums; }
  #actions { display: flex; gap: 10px; }
  input, #install { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
                    background: var(--panel); color: var(--text); }
  input { flex: 1; min-width: 0; }
  #install { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  #install:disabled { opacity: .45; cursor: default; }
  #status:empty { display: none; }
  #status { margin: 0; color: var(--muted); }
  #status.err { color: var(--err); }
</style>
</head>
<body>
  <div id="device"><span class="dot"></span><div><b id="model">No phone connected</b><small id="detail">Plug in your BlackBerry 10 with a USB cable</small></div></div>
  <div id="drop"></div>
  <div id="actions">
    <input id="password" type="password" placeholder="Device password (if set)" autocomplete="off">
    <button id="install" disabled>Install</button>
  </div>
  <p id="status"></p>
  <script src="renderer.js"></script>
</body>
</html>
